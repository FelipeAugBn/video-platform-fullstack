# Ambiente local do projeto.
#
# Sem a chave `version`: ela e obsoleta no Compose atual e so gera aviso.
#
# Cada imagem e referenciada por tag exata e digest. A tag descreve a intencao e
# o digest garante o conteudo, porque tag de registry e mutavel e digest nao. E
# o que sustenta a promessa de ambiente reproduzivel (RNF-020).

name: video-platform

# Contrato de configuracao do storage, em um so lugar.
#
# Nao e o ambiente do processo do RustFS: ele nao conhece nenhuma destas
# variaveis e receberia lixo se elas fossem injetadas nele. Quem as consome sao
# a aplicacao e o `setup` — o adapter de storage e o script que cria o bucket —,
# nas tarefas seguintes, com `<<: *storage-environment`.
#
# Declarar aqui evita que cada servico repita a lista e comece a divergir.
#
# Os dois enderecos sao variaveis separadas de proposito (plan §16.3): o interno
# serve as chamadas dentro da rede do Compose, e o publico e o que aparece nas
# URLs assinadas entregues ao navegador. Assinar com o host errado produz uma
# URL que a API considera valida e o navegador nao alcanca — a separacao torna
# essa confusao um erro visivel, nao um acerto por coincidencia.
x-storage-environment: &storage-environment
  STORAGE_ENDPOINT_INTERNAL: ${STORAGE_ENDPOINT_INTERNAL:?defina STORAGE_ENDPOINT_INTERNAL no .env da raiz}
  STORAGE_ENDPOINT_PUBLIC: ${STORAGE_ENDPOINT_PUBLIC:?defina STORAGE_ENDPOINT_PUBLIC no .env da raiz}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY no .env da raiz}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY no .env da raiz}
  STORAGE_REGION: ${STORAGE_REGION:?defina STORAGE_REGION no .env da raiz}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?defina STORAGE_BUCKET no .env da raiz}

services:
  # MySQL 8.4 LTS. Guarda os dados do dominio e tambem sessao e fila — decisao
  # do projeto para nao introduzir Redis por um volume que nao o justifica
  # (plan §7).
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb

    # O nome do container nao e fixado: fixa-lo quebraria a escala do servico.
    # O Compose o deriva do nome do projeto — `video-platform`, declarado
    # acima — mais o nome do servico.
    #
    # Como esse nome de projeto e fixo, uma segunda copia do repositorio nao
    # sobe em paralelo por padrao: reaproveitaria os mesmos containers, rede e
    # volume. Para isso e preciso outro nome de projeto, via
    # `docker compose -p <nome>` ou `COMPOSE_PROJECT_NAME`; com ele, containers,
    # rede e volume passam todos a ter nomes proprios, e os dados ficam
    # separados.

    restart: unless-stopped

    # Nenhum segredo mora aqui. `:?` faz o Compose abortar com mensagem clara
    # quando a variavel falta, em vez de subir o banco com um valor padrao
    # silencioso — senha padrao em arquivo versionado e exatamente o que
    # RNF-010 proibe.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env da raiz}
      MYSQL_DATABASE: ${DB_DATABASE:?defina DB_DATABASE no .env da raiz}
      MYSQL_USER: ${DB_USERNAME:?defina DB_USERNAME no .env da raiz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      # Nao e uma variavel da imagem oficial: quem a consome e o script de
      # inicializacao, que cria o segundo schema.
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:?defina DB_TEST_DATABASE no .env da raiz}

    volumes:
      # Volume nomeado, nao bind mount: os dados sobrevivem a recriacao do
      # container e ficam fora da arvore do repositorio.
      - mysql-dados:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # A imagem executa o que estiver aqui apenas na primeira inicializacao do
      # volume, quando o datadir ainda esta vazio.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    networks:
      - interna

    # Sem `ports`: nada e publicado no host nesta etapa. Quem precisa do banco
    # esta na mesma rede e o alcanca pelo nome do servico. Publicar a porta so
    # ampliaria a superficie exposta sem necessidade.

    # `mysqladmin ping` por TCP em 127.0.0.1, e nao pelo socket Unix: o socket
    # responde antes de a porta aceitar conexao, e e pela porta que os demais
    # servicos vao chegar. Testar o socket declararia o banco pronto cedo
    # demais.
    #
    # A senha vem de `MYSQL_PWD`, lida do ambiente do proprio container. O `$$`
    # impede o Compose de interpolar na leitura do YAML, deixando a expansao
    # para o shell de dentro. Fora da variavel de ambiente, a senha apareceria
    # nos argumentos do processo, visivel a qualquer `ps` no container.
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=TCP --host=127.0.0.1 --user=root --silent
      interval: 10s
      timeout: 5s
      retries: 10
      # A primeira subida inicializa o datadir e cria os bancos, o que leva bem
      # mais tempo que as seguintes. Durante este periodo a falha nao conta
      # para `retries` nem marca o servico como doente.
      start_period: 60s

  # Storage S3-compatible, validado em spike antes de entrar aqui: imagem, porta
  # publicada, verificacao de saude e nivel de log sao os mesmos que passaram
  # naquela validacao (docs/spikes/rustfs.md).
  #
  # Sobe e fica saudavel, nada alem disso. Criar o bucket e aplicar a politica
  # de CORS pertence ao servico `setup`, que roda uma vez antes da aplicacao.
  # Terminar esta etapa sem bucket e o resultado esperado, nao uma pendencia.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4

    restart: unless-stopped

    # Somente o que o processo do RustFS entende. As credenciais vem das mesmas
    # variaveis que a aplicacao usara para assinar, entao nao ha como o storage
    # e o cliente divergirem por configuracao duplicada.
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY no .env da raiz}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY no .env da raiz}
      RUSTFS_VOLUMES: /data
      # `warn` mantem o log legivel durante a avaliacao: em `info` o storage
      # narra cada requisicao e afoga a saida dos demais servicos.
      RUSTFS_OBS_LOGGER_LEVEL: warn

    volumes:
      # Volume nomeado. Os objetos sobrevivem a recriacao do container e ficam
      # fora da arvore do repositorio.
      - rustfs-dados:/data

    networks:
      - interna

    ports:
      # Endpoint publico do S3, e nada mais — o console administrativo nao e
      # exposto. A porta do host, 19000, e deliberadamente diferente da interna,
      # 9000, para que trocar um endereco pelo outro falhe de imediato.
      #
      # O bind em 127.0.0.1 restringe o acesso a maquina local: sem ele o Docker
      # publicaria em todas as interfaces, deixando o storage alcancavel pela
      # rede em que o host estiver.
      - "127.0.0.1:19000:9000"

    # A verificacao aponta para 127.0.0.1:9000, de dentro do proprio container.
    # Usar o endereco publico aqui testaria o encaminhamento de porta do host em
    # vez da saude do processo, e passaria a depender de algo que nao e o
    # servico.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql-dados:
  rustfs-dados:

networks:
  interna:
    driver: bridge
