# Ambiente local do projeto.
#
# Cada imagem e referenciada por tag exata e digest: a tag descreve a intencao e o
# digest garante o conteudo, porque tag de registry e mutavel e digest nao — e o
# que sustenta a promessa de ambiente reproduzivel (RNF-020).
#
# Nenhum segredo mora aqui. `:?` aborta a subida com mensagem clara quando a
# variavel falta, em vez de aplicar um padrao silencioso (RNF-010).

name: video-platform

# Contrato de configuracao do storage. Nao e o ambiente do RustFS, que nao
# conhece nenhuma destas variaveis: quem as consome sao a aplicacao e o `setup`.
#
# Os dois enderecos sao separados de proposito (plan §16.3). O interno serve as
# chamadas dentro da rede do Compose; o publico e o que aparece nas URLs
# assinadas entregues ao navegador. Assinar com o host errado produz uma URL que
# a API considera valida e o navegador nao alcanca.
x-storage-environment: &storage-environment
  STORAGE_ENDPOINT_INTERNAL: ${STORAGE_ENDPOINT_INTERNAL:?defina STORAGE_ENDPOINT_INTERNAL no .env da raiz}
  STORAGE_ENDPOINT_PUBLIC: ${STORAGE_ENDPOINT_PUBLIC:?defina STORAGE_ENDPOINT_PUBLIC no .env da raiz}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY no .env da raiz}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY no .env da raiz}
  STORAGE_REGION: ${STORAGE_REGION:?defina STORAGE_REGION no .env da raiz}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?defina STORAGE_BUCKET no .env da raiz}

# Imagem do backend, compartilhada por `api`, `setup`, `worker` e
# `simulator-worker` — sao ciclos de vida da mesma aplicacao, e o que muda entre
# eles e o comando, nunca a imagem (plan §16.1). Construcao e nome andam juntos
# para que `docker compose build setup` funcione numa copia recem-clonada.
x-backend-imagem: &backend-imagem
  build:
    context: ./docker/backend
  image: video-platform-backend:dev

# Ambiente da aplicacao. `api` e `setup` recebem o mesmo conjunto: a preparacao
# fala com o mesmo banco e o mesmo storage que a aplicacao vai usar. A senha
# administrativa do banco nao entra — ambos usam o usuario comum, que ja tem
# privilegio sobre os dois schemas.
x-backend-environment: &backend-environment
  <<: *storage-environment
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:?defina DB_DATABASE no .env da raiz}
  DB_USERNAME: ${DB_USERNAME:?defina DB_USERNAME no .env da raiz}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
  # O Laravel nao herda o padrao do servidor: declara os proprios valores na
  # conexao e em todo `CREATE TABLE`. Configurar so o MySQL deixaria as tabelas
  # com a collation do framework, divergente do plan §7.
  DB_CHARSET: utf8mb4
  DB_COLLATION: utf8mb4_0900_ai_ci
  # Log na saida de erro: escrever arquivo exigiria permissao na arvore do host.
  LOG_CHANNEL: stderr
  # Endereco publico da API, por onde o navegador chega — nao o nome do servico
  # na rede interna, e sem relacao com o host das URLs pre-assinadas.
  APP_URL: ${APP_URL:-http://localhost:8080}
  # Fila persistida no proprio MySQL (plan §13.1): unico ponto em que os quatro
  # processos PHP combinam sobre onde o trabalho fica guardado.
  QUEUE_CONNECTION: database
  # Gerada localmente na primeira subida e nunca versionada (plan §9.1). O padrao
  # vazio deixa o Compose ler o arquivo antes de a chave existir; quem recusa uma
  # chave ausente e a preparacao, com mensagem explicita.
  APP_KEY: ${APP_KEY:-}
  # Traducoes do proprio projeto, sem dependencia acrescentada so para isto.
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  # Sessao no MySQL pelo mesmo motivo da fila: o banco ja e obrigatorio e o volume
  # nao justifica um servico a mais (plan §9.1).
  SESSION_DRIVER: database
  SESSION_TABLE: sessions
  # Host-only: sem dominio declarado o navegador devolve o cookie apenas ao host
  # que o emitiu. Cookies nao sao separados por porta, entao o mesmo cookie serve
  # ao frontend em :3000 e a API em :8080 sem abrir para subdominios.
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
  # O ambiente local e HTTP: marcar como seguro faria o navegador descartar o
  # cookie. Sob HTTPS o valor precisa ser `true` — por isso vem do ambiente.
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  # Inacessivel ao JavaScript: e a credencial de autenticacao, e essa e a unica
  # defesa possivel contra um script que consiga rodar na pagina.
  SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
  # `lax` acompanha o fluxo first-party: o cookie viaja na navegacao normal e nao
  # em requisicao partida de outro site, que e o vetor do CSRF.
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  # Hosts first-party do Sanctum, que por isso autenticam por sessao em vez de
  # token (plan §9.2). Lista explicita, nunca curinga.
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000}
  # Origens completas — esquema, host e porta — autorizadas a ler as respostas.
  # Com credenciais habilitadas o navegador recusa curinga, e o curinga abriria a
  # API a qualquer origem.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  # MySQL 8.4 LTS. Guarda os dados do dominio e tambem sessao e fila — decisao do
  # projeto para nao introduzir Redis por um volume que nao o justifica (plan §7).
  #
  # Nenhum servico fixa `container_name`: fixa-lo quebraria a escala. O Compose o
  # deriva do nome do projeto, que e fixo — subir uma segunda copia do repositorio
  # em paralelo exige `docker compose -p <nome>` ou `COMPOSE_PROJECT_NAME`, sem o
  # que ela reaproveitaria containers, rede e volume desta.
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env da raiz}
      MYSQL_DATABASE: ${DB_DATABASE:?defina DB_DATABASE no .env da raiz}
      MYSQL_USER: ${DB_USERNAME:?defina DB_USERNAME no .env da raiz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      # Nao e da imagem oficial: quem a consome e o script de inicializacao, que
      # cria o segundo schema.
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:?defina DB_TEST_DATABASE no .env da raiz}

    volumes:
      # Volume nomeado, nao bind mount: os dados sobrevivem a recriacao do
      # container e ficam fora da arvore do repositorio.
      - mysql-dados:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # Executado apenas na primeira inicializacao do volume, com o datadir vazio.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    networks:
      - interna

    # Sem `ports`: quem precisa do banco esta na mesma rede.

    # Ping por TCP, e nao pelo socket Unix: o socket responde antes de a porta
    # aceitar conexao, e e pela porta que os demais servicos chegam. A senha vem
    # de `MYSQL_PWD` porque nos argumentos apareceria em qualquer `ps`; o `$$`
    # deixa a expansao para o shell de dentro do container.
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=TCP --host=127.0.0.1 --user=root --silent
      interval: 10s
      timeout: 5s
      retries: 10
      # A primeira subida inicializa o datadir e cria os bancos; ate aqui a falha
      # nao conta para `retries`.
      start_period: 60s

  # Storage S3-compatible, validado em spike antes de entrar aqui: imagem, porta,
  # verificacao de saude e nivel de log sao os que passaram naquela validacao
  # (docs/spikes/rustfs.md). Sobe e fica saudavel, nada alem disso — criar o
  # bucket e aplicar a politica de CORS pertence ao `setup`.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4

    restart: unless-stopped

    # Somente o que o processo entende, a partir das mesmas variaveis que a
    # aplicacao usara para assinar: storage e cliente nao podem divergir.
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY no .env da raiz}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY no .env da raiz}
      RUSTFS_VOLUMES: /data
      # Em `info` o storage narra cada requisicao e afoga a saida dos demais.
      RUSTFS_OBS_LOGGER_LEVEL: warn

    volumes:
      - rustfs-dados:/data

    networks:
      - interna

    ports:
      # Endpoint publico do S3, e nada mais — o console administrativo nao e
      # exposto. A porta do host e diferente da interna para que trocar um
      # endereco pelo outro falhe de imediato. O bind em 127.0.0.1, aqui e nos
      # demais servicos, evita que o Docker publique em todas as interfaces.
      - "127.0.0.1:19000:9000"

    # De dentro do container: pelo endereco publico isto testaria o encaminhamento
    # de porta do host, e nao a saude do processo.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Preparacao do ambiente: roda uma vez, termina e sai. Nao expoe porta, nao tem
  # verificacao de saude e nao reinicia — nada disso faz sentido para um processo
  # que existe para acabar. Quem observa o resultado e o `api` (plan §16.2).
  setup:
    <<: *backend-imagem

    # `no` entre aspas: sem elas o YAML leria a palavra como booleano.
    restart: "no"

    environment:
      <<: *backend-environment

    volumes:
      # Mesmo ponto de montagem do `api`: os dois enxergam a mesma arvore.
      - ./backend:/app
      - ./docker/backend/setup.sh:/usr/local/bin/setup.sh:ro
      # Apenas os dois arquivos de bootstrap, e nao o diretorio inteiro. Ficam
      # lado a lado porque o script localiza a politica de CORS ao lado de si.
      - ./docker/rustfs/criar-bucket.sh:/opt/storage-bootstrap/criar-bucket.sh:ro
      - ./docker/rustfs/cors.json:/opt/storage-bootstrap/cors.json:ro

    working_dir: /app

    command: ["/usr/local/bin/setup.sh"]

    networks:
      - interna

    # Saudaveis, e nao apenas iniciados: a preparacao abre conexao com os dois na
    # primeira linha de trabalho.
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # A aplicacao Laravel em PHP-FPM. Este container fala FastCGI, nao HTTP: quem
  # atende o navegador e o `web`, e uma verificacao HTTP apontada para ca falharia
  # sempre (plan §16.2).
  api:
    <<: *backend-imagem

    restart: unless-stopped

    environment:
      <<: *backend-environment
      # Schema da suite, e so aqui: e deste servico que nascem os containers
      # descartaveis em que ela roda. O bootstrap da suite recusa a execucao se a
      # variavel faltar, estiver vazia ou coincidir com o banco da aplicacao
      # (plan §17.2).
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:?defina DB_TEST_DATABASE no .env da raiz}

    volumes:
      # Edicao no host aparece sem reconstruir a imagem. Em leitura e escrita
      # porque comandos de desenvolvimento, como a geracao do autoload, atualizam
      # arquivos dentro da arvore.
      - ./backend:/app

    # Views compiladas em memoria — e somente elas.
    #
    # O PHP-FPM roda como `www-data`, dono diferente de quem criou os arquivos no
    # host: sem isto, compilar uma view falha por permissao e a aplicacao so
    # responde enquanto sobrar cache de uma execucao anterior. `uid` e `gid` 33
    # sao os de `www-data` na imagem, entao nada depende de quem clonou o
    # repositorio. View compilada e descartavel: some com o container e e refeita
    # na primeira requisicao.
    tmpfs:
      - "/app/storage/framework/views:uid=33,gid=33,mode=0700"

    working_dir: /app

    # Declarado mesmo coincidindo com o padrao da imagem: e o comando que
    # distingue este servico dos outros tres que a compartilham.
    command: ["php-fpm"]

    networks:
      - interna

    # Sem `ports`: FastCGI nao autentica e executa o que o cliente pedir, entao
    # publicar a 9000 no host seria expor um interpretador.

    # A espera e so pelo `setup`: banco e storage ja sao pre-requisito dele, e
    # repetir a dependencia aqui deixaria a aplicacao subir com o ambiente pela
    # metade caso a preparacao falhasse. `service_completed_successfully` exige
    # codigo de saida zero — o PHP-FPM so aceita conexao depois de banco migrado e
    # bucket criado.
    depends_on:
      setup:
        condition: service_completed_successfully

    # A verificacao fala o protocolo do proprio servico: nao ha requisicao web
    # aqui, e conferir a sintaxe da configuracao daria o mesmo resultado com o
    # processo de pe ou nao.
    #
    # O comando abre a conexao na 9000, envia um registro FastCGI de consulta de
    # parametros — os 17 bytes de `FCGI_MPXS_CONNS` — e exige resposta com
    # cabecalho do tipo 10. So abrir a conexao passaria contra qualquer coisa
    # escutando na porta; responder o protocolo so quem o entende consegue, e quem
    # responde e um processo filho do pool, entao o sucesso significa trabalhador
    # disponivel. O `$$` protege as variaveis do interpretador da interpolacao.
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$c = @stream_socket_client("tcp://127.0.0.1:9000", timeout: 2) or exit(1); fwrite($$c, pack("CCnnCC", 1, 9, 0, 17, 0, 0) . "\x0f\x00FCGI_MPXS_CONNS"); stream_set_timeout($$c, 2); $$r = fread($$c, 8); exit(strlen($$r) === 8 && ord($$r[1]) === 10 ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Servidor HTTP a frente do PHP-FPM, e unica porta de entrada da API.
  web:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c

    restart: unless-stopped

    volumes:
      # Entra no diretorio que a imagem ja inclui a partir do bloco `http`, sem
      # substituir a configuracao principal dela.
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Somente o diretorio publico, e somente leitura: servir estatico e
      # encaminhar o resto nao exige enxergar codigo, dependencias ou storage. O
      # caminho e o mesmo que o `api` ve, porque o `SCRIPT_FILENAME` enviado daqui
      # e resolvido la dentro.
      - ./backend/public:/app/public:ro

    networks:
      - interna

    ports:
      - "127.0.0.1:8080:80"

    # Subir antes de o PHP-FPM aceitar conexao renderia 502.
    depends_on:
      api:
        condition: service_healthy

    # `/up` e o endpoint de prontidao padrao do Laravel, e e deliberadamente
    # minimo: prova que a aplicacao responde, e nada sobre as dependencias dela.
    # `wget` ja acompanha a imagem; `curl` nao, e nao vale um pacote a mais.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Consumidor da fila principal: mesmo codigo e mesmo ambiente do `api`, em outro
  # ciclo de vida. Nesta etapa a fila esta configurada e vazia, entao o processo
  # sobe, anuncia a fila que consome e fica ocioso.
  worker:
    <<: *backend-imagem

    restart: unless-stopped

    environment:
      <<: *backend-environment

    volumes:
      - ./backend:/app

    working_dir: /app

    # As opcoes ficam no comando, e nao em cada classe de job: valem para tudo o
    # que este processo executar, inclusive antes de existir a primeira delas
    # (plan §13.1). Sao tres tentativas, espera de 10, 30 e 60 segundos, e 60
    # segundos de execucao por job.
    #
    # A janela de reserva da conexao e de 90 segundos, deliberadamente maior que o
    # tempo limite: se a fila devolvesse o job antes de o processo desistir dele,
    # o mesmo trabalho rodaria duas vezes em paralelo. Falha esgotada nao some:
    # vai para `failed_jobs`, com carga e excecao.
    command:
      - php
      - artisan
      - queue:work
      - --queue=default
      - --tries=3
      - --backoff=10,30,60
      - --timeout=60

    networks:
      - interna

    # Mesma espera do `api`: a tabela que o consumidor le e criada pela preparacao.
    depends_on:
      setup:
        condition: service_completed_successfully

    # Maior que o tempo limite do job: ao receber o sinal de parada o processo
    # termina o job corrente e so entao sai. Com a margem padrao de 10 segundos
    # ele levaria o sinal de forca no meio do trabalho.
    stop_grace_period: 70s

  # Consumidor da fila do simulador de processamento.
  #
  # Processo separado de proposito, e nao uma segunda fila no mesmo consumidor: o
  # simulador representa um provedor externo, com tempo de espera proprio, e uma
  # fila dele congestionada nao pode atrasar o trabalho da aplicacao (plan §13.2).
  # Como o `worker`, sobe ocioso nesta etapa.
  simulator-worker:
    <<: *backend-imagem

    restart: unless-stopped

    environment:
      <<: *backend-environment

    volumes:
      - ./backend:/app

    working_dir: /app

    # Mesmas opcoes do `worker`, sobre outra fila. A politica de reentrega e a
    # mesma que o plano descreve para a chamada do callback (plan §13.4).
    command:
      - php
      - artisan
      - queue:work
      - --queue=simulator
      - --tries=3
      - --backoff=10,30,60
      - --timeout=60

    networks:
      - interna

    depends_on:
      setup:
        condition: service_completed_successfully

    stop_grace_period: 70s

  # Nuxt em modo de desenvolvimento: a interface da aplicacao.
  frontend:
    build:
      context: ./docker/frontend
    image: video-platform-frontend:dev

    restart: unless-stopped

    # Com o dono dos arquivos do repositorio: o servidor de desenvolvimento
    # escreve o diretorio de build intermediario na arvore montada, e escrito por
    # outro dono ele ficaria inacessivel a proxima instalacao de dependencias. O
    # alvo de subida exporta os identificadores da maquina; o padrao atende quem
    # sobe o ambiente sem passar por ele.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"

    environment:
      # O mesmo `APP_URL`: quem faz a requisicao e a pagina no navegador, fora da
      # rede do Compose, e o nome do servico interno geraria uma base que so um
      # container resolve.
      NUXT_PUBLIC_API_BASE: ${APP_URL:-http://localhost:8080}
      # O identificador pode nao ter diretorio pessoal na imagem; sem isto o
      # gerenciador de pacotes escreveria cache na raiz.
      HOME: /tmp

    volumes:
      # O `node_modules` e instalado uma vez pela preparacao e sobrevive a
      # recriacao do container, que nao instala nada ao subir.
      - ./frontend:/app

    working_dir: /app

    # `--host 0.0.0.0` faz o servidor escutar em todas as interfaces do container;
    # no padrao ele atende so em `localhost` de dentro dele, e o encaminhamento de
    # porta nao alcancaria nada. Modo SPA, sem renderizacao no servidor: essa
    # decisao vive na configuracao da aplicacao (plan §15.1).
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

    networks:
      - interna

    ports:
      - "127.0.0.1:3000:3000"

    # A interface espera a porta de entrada da API, e nao o PHP-FPM: quem prova
    # que a aplicacao esta pronta e o `web` (plan §16.2).
    depends_on:
      web:
        condition: service_healthy

volumes:
  mysql-dados:
  rustfs-dados:

networks:
  interna:
    driver: bridge
