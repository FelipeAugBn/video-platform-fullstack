      operationId: listarCursosConcedidos
      summary: Lista os cursos concedidos ao consumidor
      description: |
        Duas condicoes, as duas **dentro da consulta**: o curso precisa ter
        concessao para o consumidor autenticado **e** estar em `available`.

        Por isso `meta.total` conta apenas o conjunto autorizado — filtrar depois
        de carregar faria a contagem revelar quantos cursos existem fora da
        concessao.

        Um curso concedido ainda em `draft` nao aparece aqui: nao ha nada
        publicado a consumir. Ele continua acessivel pelo endereco direto.

        Consumidor sem nenhuma concessao recebe `200` com lista vazia — nao ter
        acesso a nada e um estado legitimo, nao um erro.
      parameters:
