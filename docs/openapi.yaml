openapi: 3.1.0

info:
  title: Plataforma de Conteudo em Video — API
  version: "1.0.0"
  summary: Catalogo de cursos, envio de video em partes, processamento assincrono e reproducao autorizada.
  description: |
    API REST/JSON que sustenta as duas jornadas da plataforma: o **produtor**
    organiza cursos, modulos e aulas, envia o video e publica; o **consumidor**
    navega o que lhe foi concedido e obtem os dados de reproducao.

    ## Convencoes

    **Envelope.** Todo recurso e toda colecao saem sob `data`. Listagens
    paginadas acrescentam `meta` e `links`, e nada alem desses tres membros.

    **Erros.** Toda falha responde `application/problem+json` conforme a
    RFC 9457, com um `code` funcional estavel — e o `code`, e nao o texto de
    `detail`, que o cliente deve usar para decidir o que mostrar. Nenhum corpo de
    erro carrega mensagem de excecao, consulta, caminho de arquivo ou qualquer
    detalhe interno.

    **Sem prefixo de versao.** Nao existe `/v1`: introduzi-lo antes de haver um
    segundo consumidor do contrato seria cerimonia sem beneficio. Este documento,
    versionado junto do codigo, e onde uma mudanca de contrato fica visivel.

    **`405`.** Qualquer endereco existente chamado com um metodo que ele nao
    aceita responde `405` com corpo de problema e o cabecalho `Allow` listando os
    metodos aceitos. Isso vale para todas as rotas e nao esta repetido operacao a
    operacao.

    ## Autenticacao — SPA com cookie de sessao

    Nao ha token no corpo nem no cabecalho `Authorization`. A sessao vive em um
    cookie `HttpOnly`, inacessivel ao JavaScript, e as operacoes que alteram
    estado exigem tambem um token de protecao contra requisicao forjada.

    A sequencia que um cliente precisa seguir:

    1. `GET /sanctum/csrf-cookie` — planta os cookies `XSRF-TOKEN` e de sessao;
    2. **preservar os cookies** entre as chamadas (`cookie jar` no Postman,
       Insomnia ou `curl -c/-b`);
    3. enviar o valor do cookie `XSRF-TOKEN`, decodificado de URL, no cabecalho
       `X-XSRF-TOKEN` de **toda** operacao mutante — `POST` inclusive o login;
    4. seguir enviando os cookies nas chamadas seguintes.

    **Fora do navegador, o cabecalho `Origin` e obrigatorio.** A sessao so e
    aplicada a requisicoes reconhecidas como *first-party*, e o reconhecimento
    compara o `Origin` com os dominios declarados na configuracao do ambiente —
    `http://localhost:3000` no ambiente local. O navegador o envia sozinho e nao
    permite sobrescreve-lo; `curl`, Postman e Insomnia nao o enviam por conta
    propria. Sem ele nao ha sessao, e o login falha em vez de autenticar.

    Por isso ele **nao** aparece como parametro das operacoes: nao e algo que o
    cliente do navegador escolhe, e declara-lo faria um cliente gerado tentar
    definir um cabecalho que o proprio navegador controla.

    O login **regenera a sessao**, e com ela o `XSRF-TOKEN`. Quem guardou o token
    antes de autenticar precisa reler o cookie depois; nao fazer isso produz
    `419` na primeira operacao apos o login.

    Token ausente ou incorreto responde `419` com o codigo
    `CSRF_TOKEN_MISMATCH`, **sem executar a operacao**. E um estado proprio, e
    nao uma falha de autenticacao: o tratamento correto e obter um token novo e
    repetir a requisicao uma vez.

    ## Perfis

    Cada usuario tem exatamente um perfil. Rotas de gestao exigem `producer`;
    rotas de consumo exigem `consumer`. Perfil errado responde `403`.

    Propriedade e concessao sao decididas depois, no caso de uso, e falham com
    `404` — nunca `403`. A diferenca e deliberada: `403` admitiria que o recurso
    existe, e comparar as duas respostas transformaria a API num verificador de
    identificadores alheios. **Recurso inexistente, recurso de outro produtor e
    curso sem concessao respondem exatamente a mesma coisa.**

    ## Os bytes do video nao passam por esta API

    Nenhuma rota recebe ou devolve o conteudo do arquivo. O envio abre uma
    operacao multipart, o cliente pede uma URL temporaria por parte e envia cada
    uma **direto ao armazenamento**; a conclusao apenas informa os comprovantes.
    A reproducao devolve uma URL assinada de curta duracao, e nao o arquivo.

  contact:
    name: Repositorio do projeto
    url: https://github.com/

servers:
  - url: http://localhost:8080
    description: Ambiente local levantado pelo Compose (`make up`)

tags:
  - name: Autenticacao
    description: Sessao, perfil e protecao CSRF.
  - name: Catalogo do produtor
    description: Cursos, modulos, aulas e a arvore do curso — sempre restritos ao proprietario.
  - name: Video
    description: Abertura do envio, URLs de parte, conclusao e estado do processamento.
  - name: Catalogo do consumidor
    description: Cursos concedidos, navegacao do conteudo publicado e reproducao.
  - name: Webhook
    description: Callback de processamento, autenticado por assinatura HMAC.

security:
  - sessaoSpa: []

paths:

  # ---------------------------------------------------------------------------
  # Autenticacao
  # ---------------------------------------------------------------------------

  /sanctum/csrf-cookie:
    get:
      tags: [Autenticacao]
      operationId: obterCookieCsrf
      summary: Planta o cookie de protecao CSRF
      description: |
        Primeira chamada de qualquer cliente. Devolve `204` sem corpo e planta
        dois cookies: `XSRF-TOKEN`, legivel pelo cliente, e o cookie de sessao.

        O valor de `XSRF-TOKEN` chega **codificado como URL** e precisa ser
        decodificado antes de ir no cabecalho `X-XSRF-TOKEN`.

        Esta rota fica fora do prefixo `/api` — ela e registrada pelo proprio
        Sanctum e ja chega com o middleware de sessao.
      security: []
      responses:
        "204":
          description: Cookies plantados. Sem corpo.
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN` e o cookie de sessao.'
              schema:
                type: string
                examples: ["XSRF-TOKEN=exemplo-de-token; Path=/; SameSite=Lax"]

  /api/auth/login:
    post:
      tags: [Autenticacao]
      operationId: autenticar
      summary: Autentica e abre a sessao
      description: |
        Credencial invalida e recusada como **erro de validacao** (`422`), com a
        mensagem associada ao campo `email`. A resposta e identica para usuario
        inexistente e para senha incorreta: distinguir os dois transformaria a
        tela de autenticacao num verificador de cadastro.

        A operacao regenera a sessao — e, com ela, o `XSRF-TOKEN`. Releia o
        cookie antes da proxima operacao mutante.
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciais"
            examples:
              produtor:
                summary: Produtor de demonstracao
                value:
                  email: producer@video-platform.test
                  password: VideoDemo2026!
      responses:
        "200":
          description: Sessao aberta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioEnvelope"
              examples:
                produtor:
                  value:
                    data:
                      id: 01a06e16-10ac-721b-9e80-fb8e67bb563f
                      name: Produtora de Demonstracao
                      email: producer@video-platform.test
                      role: producer
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          description: Campos ausentes ou credencial recusada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaDeValidacao"
              examples:
                credencialRecusada:
                  value:
                    type: https://api.example.test/problems/validation-failed
                    title: Dados invalidos
                    status: 422
                    detail: Revise os campos informados.
                    code: VALIDATION_FAILED
                    errors:
                      email: ["As credenciais informadas nao conferem."]
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/auth/me:
    get:
      tags: [Autenticacao]
      operationId: usuarioAutenticado
      summary: Devolve o usuario da sessao corrente
      description: Leitura; nao exige token CSRF.
      responses:
        "200":
          description: O usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioEnvelope"
              examples:
                consumidor:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29c3e6a61f
                      name: Consumidor de Demonstracao
                      email: consumer@video-platform.test
                      role: consumer
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/auth/logout:
    post:
      tags: [Autenticacao]
      operationId: encerrarSessao
      summary: Encerra a sessao
      description: |
        Invalida a sessao e rotaciona o identificador dela. Responde `204` sem
        corpo.
      parameters:
        - $ref: "#/components/parameters/TokenCsrf"
      responses:
        "204":
          description: Sessao encerrada. Sem corpo.
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "500":
          $ref: "#/components/responses/ErroInterno"

  # ---------------------------------------------------------------------------
  # Catalogo do produtor
  # ---------------------------------------------------------------------------

  /api/courses:
    get:
      tags: [Catalogo do produtor]
      operationId: listarCursos
      summary: Lista os cursos do produtor autenticado
      description: |
        Paginada. O recorte por proprietario acontece **na consulta**, entao
        `meta.total` e `meta.last_page` contam somente os cursos proprios.

        Ordem: criacao decrescente, com o identificador como criterio de
        desempate para tornar a sequencia estavel entre paginas.
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
      responses:
        "200":
          description: Pagina de cursos proprios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursosPaginados"
              examples:
                primeiraPagina:
                  value:
                    data:
                      - id: 01a06e16-10ae-73fc-a2d5-3e29c4f41112
                        title: Fundamentos de Video
                        description: Curso de demonstracao.
                        owner_id: 01a06e16-10ac-721b-9e80-fb8e67bb563f
                        state: available
                        created_at: "2026-09-05T13:45:12+00:00"
                    meta:
                      current_page: 1
                      per_page: 15
                      total: 1
                      last_page: 1
                    links:
                      first: "http://localhost:8080/api/courses?per_page=15&page=1"
                      prev: null
                      next: null
                      last: "http://localhost:8080/api/courses?per_page=15&page=1"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "422":
          $ref: "#/components/responses/ValidacaoFalhou"
        "500":
          $ref: "#/components/responses/ErroInterno"

    post:
      tags: [Catalogo do produtor]
      operationId: criarCurso
      summary: Cria um curso
      description: |
        O proprietario vem **da sessao**. Um `owner_id` enviado no corpo e
        ignorado — o campo nao existe na validacao.

        O curso nasce em `draft` e passa a `available` sozinho na primeira
        publicacao de aula.
      parameters:
        - $ref: "#/components/parameters/TokenCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovoCurso"
            examples:
              curso:
                value:
                  title: Fundamentos de Video
                  description: Curso de demonstracao.
      responses:
        "201":
          description: Curso criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoEnvelope"
              examples:
                criado:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29c4f41112
                      title: Fundamentos de Video
                      description: Curso de demonstracao.
                      owner_id: 01a06e16-10ac-721b-9e80-fb8e67bb563f
                      state: draft
                      created_at: "2026-09-05T13:45:12+00:00"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          $ref: "#/components/responses/ValidacaoFalhou"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/courses/{course}:
    get:
      tags: [Catalogo do produtor]
      operationId: obterCurso
      summary: Consulta um curso proprio
      parameters:
        - $ref: "#/components/parameters/CursoId"
      responses:
        "200":
          description: O curso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoEnvelope"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/courses/{course}/structure:
    get:
      tags: [Catalogo do produtor]
      operationId: obterEstruturaDoCurso
      summary: Arvore do curso, como o produtor a ve
      description: |
        Curso, modulos e aulas aninhados e ordenados por `position`.

        **Inclui rascunhos e o estado do video de cada aula** — a jornada do
        produtor exige acompanhar o que ainda nao foi publicado e o que ainda
        esta processando. A visao equivalente do consumidor
        (`GET /api/catalog/courses/{course}`) nao traz nenhum dos dois.

        Nao e paginada: a arvore e uma ordem, e paginar a ordem a quebraria.
      parameters:
        - $ref: "#/components/parameters/CursoId"
      responses:
        "200":
          description: A arvore completa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstruturaEnvelope"
              examples:
                arvore:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29c4f41112
                      title: Fundamentos de Video
                      description: Curso de demonstracao.
                      owner_id: 01a06e16-10ac-721b-9e80-fb8e67bb563f
                      state: available
                      created_at: "2026-09-05T13:45:12+00:00"
                      modules:
                        - id: 01a06e16-10ae-73fc-a2d5-3e29c7dce499
                          course_id: 01a06e16-10ae-73fc-a2d5-3e29c4f41112
                          title: Introducao
                          position: 1
                          lessons:
                            - id: 01a06e16-10ae-73fc-a2d5-3e29c822bc32
                              module_id: 01a06e16-10ae-73fc-a2d5-3e29c7dce499
                              title: Primeiros passos
                              position: 1
                              published_at: "2026-09-06T10:00:00+00:00"
                              video_state: ready
                            - id: 01a06e16-10ae-73fc-a2d5-3e29c9330001
                              module_id: 01a06e16-10ae-73fc-a2d5-3e29c7dce499
                              title: Rascunho ainda sem video
                              position: 2
                              published_at: null
                              video_state: null
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/courses/{course}/modules:
    get:
      tags: [Catalogo do produtor]
      operationId: listarModulos
      summary: Lista os modulos do curso, em ordem
      description: Colecao **nao** paginada — sai sob `data`, sem `meta` nem `links`.
      parameters:
        - $ref: "#/components/parameters/CursoId"
      responses:
        "200":
          description: Modulos ordenados por `position`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModulosEnvelope"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

    post:
      tags: [Catalogo do produtor]
      operationId: criarModulo
      summary: Cria um modulo no curso
      description: |
        A posicao **nao** e recebida do cliente: ela e a proxima livre dentro do
        curso, calculada sob trava.
      parameters:
        - $ref: "#/components/parameters/CursoId"
        - $ref: "#/components/parameters/TokenCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovoModulo"
            examples:
              modulo:
                value:
                  title: Introducao
      responses:
        "201":
          description: Modulo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuloEnvelope"
              examples:
                criado:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29c7dce499
                      course_id: 01a06e16-10ae-73fc-a2d5-3e29c4f41112
                      title: Introducao
                      position: 1
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          $ref: "#/components/responses/ValidacaoFalhou"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/modules/{module}/lessons:
    post:
      tags: [Catalogo do produtor]
      operationId: criarAula
      summary: Cria uma aula no modulo
      description: |
        A aula nasce **em rascunho e sem video**: `published_at` e `video_state`
        saem nulos, e nao ha parametro capaz de mudar isso na criacao.
      parameters:
        - $ref: "#/components/parameters/ModuloId"
        - $ref: "#/components/parameters/TokenCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovaAula"
            examples:
              aula:
                value:
                  title: Primeiros passos
      responses:
        "201":
          description: Aula criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AulaEnvelope"
              examples:
                criada:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29c822bc32
                      module_id: 01a06e16-10ae-73fc-a2d5-3e29c7dce499
                      title: Primeiros passos
                      position: 1
                      published_at: null
                      video_state: null
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          $ref: "#/components/responses/ValidacaoFalhou"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/lessons/{lesson}:
    get:
      tags: [Catalogo do produtor]
      operationId: obterAula
      summary: Consulta uma aula propria
      description: |
        `video_state` vem da tentativa atual, e nao de uma copia guardada na
        aula. Nulo significa que nenhum envio foi aberto ainda.
      parameters:
        - $ref: "#/components/parameters/AulaId"
      responses:
        "200":
          description: A aula.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AulaEnvelope"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/lessons/{lesson}/publish:
    post:
      tags: [Catalogo do produtor]
      operationId: publicarAula
      summary: Publica a aula
      description: |
        Exige video em `ready` **com referencia de reproducao registrada**.
        Falhando a condicao, a resposta e `409` com o codigo que diz qual das
        tres nao foi satisfeita, para a interface exibir conflito de regra em vez
        de erro generico.

        Republicar uma aula ja publicada responde `200` sem efeito novo, e sem
        reavaliar o video. A primeira publicacao do curso o torna `available` na
        mesma transacao.
      parameters:
        - $ref: "#/components/parameters/AulaId"
        - $ref: "#/components/parameters/TokenCsrf"
      responses:
        "200":
          description: Aula publicada — ou ja publicada, sem efeito novo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AulaEnvelope"
              examples:
                publicada:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29c822bc32
                      module_id: 01a06e16-10ae-73fc-a2d5-3e29c7dce499
                      title: Primeiros passos
                      position: 1
                      published_at: "2026-09-06T10:00:00+00:00"
                      video_state: ready
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: |
            A condicao de publicacao nao foi satisfeita. O `code` distingue os
            tres motivos, e `video_state` acompanha o problema como membro de
            extensao para a interface nao precisar de uma segunda requisicao.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaDePublicacao"
              examples:
                semVideo:
                  summary: A aula nunca teve um envio
                  value:
                    type: https://api.example.test/problems/lesson-without-video
                    title: Aula sem video
                    status: 409
                    detail: Esta aula ainda nao tem video. Envie um video antes de publicar.
                    code: LESSON_WITHOUT_VIDEO
                videoNaoPronto:
                  summary: O video ainda esta processando
                  value:
                    type: https://api.example.test/problems/lesson-video-not-ready
                    title: Video ainda nao esta pronto
                    status: 409
                    detail: O video desta aula ainda nao esta pronto para reproducao.
                    code: LESSON_VIDEO_NOT_READY
                    video_state: processing
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "500":
          $ref: "#/components/responses/ErroInterno"

  # ---------------------------------------------------------------------------
  # Video — envio, conclusao e estado
  # ---------------------------------------------------------------------------

  /api/lessons/{lesson}/video/uploads:
    post:
      tags: [Video]
      operationId: abrirEnvioDeVideo
      summary: Abre um envio de video em partes
      description: |
        Valida o que o cliente declara contra os limites do backend — tipo
        `video/mp4`, tamanho de 1 byte a 10 GiB — e abre a operacao multipart no
        armazenamento.

        A resposta e o **plano de envio**: quantas partes, de que tamanho, e o
        identificador da tentativa. Nenhum byte e enviado nesta chamada.

        **A chave do objeto e escolhida pelo servidor**, derivada do
        identificador da tentativa — nunca do nome do arquivo. O `filename`
        declarado e guardado apenas como informacao.

        Um novo envio so e aceito se a tentativa atual da aula tiver terminado em
        `failed`; qualquer outro estado responde `409` com `VIDEO_ATTEMPT_ACTIVE`
        e o estado que impede como membro de extensao.
      parameters:
        - $ref: "#/components/parameters/AulaId"
        - $ref: "#/components/parameters/TokenCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AberturaDeEnvio"
            examples:
              arquivoDeUmGigabyte:
                value:
                  filename: aula-01.mp4
                  content_type: video/mp4
                  size: 1073741824
      responses:
        "201":
          description: Envio aberto. O plano diz em quantas partes transferir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanoEnvelope"
              examples:
                plano:
                  value:
                    data:
                      attempt_id: 01a06e16-10ae-73fc-a2d5-3e29ca110001
                      storage_key: videos/01a06e16-10ae-73fc-a2d5-3e29ca110001/original.mp4
                      upload_id: exemplo-de-identificador-multipart
                      part_size: 67108864
                      part_count: 16
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: A aula ja tem uma tentativa que nao terminou em falha.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaDeEnvio"
              examples:
                tentativaAtiva:
                  value:
                    type: https://api.example.test/problems/video-attempt-active
                    title: Aula com tentativa de video ativa
                    status: 409
                    detail: >-
                      Esta aula ja tem uma tentativa de video em andamento ou concluida.
                      Um novo envio so e aceito depois que a tentativa atual terminar em falha.
                    code: VIDEO_ATTEMPT_ACTIVE
                    video_state: processing
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          description: Tipo nao aceito, tamanho fora dos limites ou campo ausente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemaDeValidacao"
              examples:
                tipoRecusado:
                  value:
                    type: https://api.example.test/problems/validation-failed
                    title: Dados invalidos
                    status: 422
                    detail: Revise os campos informados.
                    code: VALIDATION_FAILED
                    errors:
                      content_type: ["O campo tipo de conteudo e invalido."]
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/video-uploads/{attempt}/parts/{part}/url:
    post:
      tags: [Video]
      operationId: emitirUrlDeParte
      summary: Emite a URL temporaria de uma parte
      description: |
        Devolve a URL assinada para o **navegador** enviar aquela parte direto ao
        armazenamento, por `PUT`, com os bytes correspondentes. Ela vale 15
        minutos e pode ser renovada chamando esta rota de novo — renovar nao
        altera nada no dominio.

        O **primeiro** pedido move a tentativa de `pending` para `uploading`. Os
        seguintes nao mudam estado.

        Numero de parte fora do plano do arquivo responde `422`; tentativa que ja
        encerrou o envio responde `409` com `VIDEO_UPLOAD_NOT_ACTIVE`.

        Guarde o `ETag` que o armazenamento devolver em cada `PUT`: ele e
        obrigatorio na conclusao.
      parameters:
        - $ref: "#/components/parameters/TentativaId"
        - $ref: "#/components/parameters/NumeroDaParte"
        - $ref: "#/components/parameters/TokenCsrf"
      responses:
        "200":
          description: URL temporaria da parte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlDeParteEnvelope"
              examples:
                parte:
                  value:
                    data:
                      url: https://storage.exemplo.test/videos/exemplo/original.mp4?partNumber=1&uploadId=exemplo&assinatura=REDIGIDO
                      expires_at: "2026-09-06T12:15:00+00:00"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: O envio ja foi encerrado e nao aceita mais partes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              examples:
                envioEncerrado:
                  value:
                    type: https://api.example.test/problems/video-upload-not-active
                    title: Envio de video encerrado
                    status: 409
                    detail: Este envio ja foi encerrado e nao aceita mais operacoes.
                    code: VIDEO_UPLOAD_NOT_ACTIVE
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          $ref: "#/components/responses/ValidacaoFalhou"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/video-uploads/{attempt}/complete:
    post:
      tags: [Video]
      operationId: concluirEnvio
      summary: Conclui o envio e enfileira o processamento
      description: |
        Recebe os comprovantes de todas as partes — `part_number` e `etag`,
        **repassado exatamente como o armazenamento o devolveu, aspas
        inclusive**. Remover as aspas quebra a conclusao.

        O backend manda o armazenamento reunir as partes e depois **observa o
        objeto** de forma independente: existencia, tamanho, tipo e os metadados
        que ele mesmo gravou na abertura. Nada disso vem do relato do cliente.

        Quatro desfechos, e o que os separa e o **resultado da operacao**, nunca
        o estado em que a tentativa ficou:

        | Situacao | Resposta |
        | --- | --- |
        | Conclusao nova e valida, com o processamento enfileirado no mesmo commit | `202` |
        | Repeticao de uma conclusao ja aceita | `200`, sem enfileirar de novo |
        | Objeto confirmadamente ausente ou incompativel, e a repeticao dessa recusa | `409` |
        | Conclusao pedida sobre tentativa que nao comecou a transferir | `409` |
        | Sem evidencia sobre o objeto — indisponibilidade, credencial, permissao | `503` |

        A recusa e **gravada antes** de virar `409`: a tentativa fica em `failed`,
        que e o unico estado a partir do qual um novo envio e aceito.
      parameters:
        - $ref: "#/components/parameters/TentativaId"
        - $ref: "#/components/parameters/TokenCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConclusaoDeEnvio"
            examples:
              duasPartes:
                value:
                  parts:
                    - part_number: 1
                      etag: '"exemplo-de-comprovante-da-parte-1"'
                    - part_number: 2
                      etag: '"exemplo-de-comprovante-da-parte-2"'
      responses:
        "202":
          description: Conclusao aceita **agora**; processamento enfileirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TentativaEnvelope"
              examples:
                aceita:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29ca110001
                      lesson_id: 01a06e16-10ae-73fc-a2d5-3e29c822bc32
                      state: uploaded
                      filename: aula-01.mp4
                      failure_code: null
                      failure_message: null
        "200":
          description: |
            Conclusao **ja** aceita numa chamada anterior. Nenhum processamento
            novo foi enfileirado. O estado pode ser `uploaded`, `processing` ou
            `ready`, conforme o quanto ja avancou.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TentativaEnvelope"
              examples:
                repetida:
                  value:
                    data:
                      id: 01a06e16-10ae-73fc-a2d5-3e29ca110001
                      lesson_id: 01a06e16-10ae-73fc-a2d5-3e29c822bc32
                      state: processing
                      filename: aula-01.mp4
                      failure_code: null
                      failure_message: null
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/PerfilNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: |
            Conclusao recusada. `VIDEO_OBJECT_MISSING` e `VIDEO_OBJECT_MISMATCH`
            deixam a tentativa em `failed` e liberam um novo envio;
            `VIDEO_UPLOAD_NOT_ACTIVE` sobre uma tentativa em `pending` nao toca no
            armazenamento.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              examples:
                objetoAusente:
                  value:
                    type: https://api.example.test/problems/video-object-missing
                    title: Arquivo nao encontrado
                    status: 409
                    detail: O arquivo enviado nao foi encontrado no armazenamento. Envie o video novamente.
                    code: VIDEO_OBJECT_MISSING
                naoComecou:
                  value:
                    type: https://api.example.test/problems/video-upload-not-active
                    title: Envio de video encerrado
                    status: 409
                    detail: Este envio ja foi encerrado e nao aceita mais operacoes.
                    code: VIDEO_UPLOAD_NOT_ACTIVE
        "419":
          $ref: "#/components/responses/TokenCsrfInvalido"
        "422":
          $ref: "#/components/responses/ValidacaoFalhou"
        "503":
          description: |
            Sem evidencia sobre o objeto. A tentativa **permanece** em
            `uploading` e a conclusao pode ser repetida.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              examples:
                semEvidencia:
                  value:
                    type: https://api.example.test/problems/service-unavailable
                    title: Servico temporariamente indisponivel
                    status: 503
                    detail: Tente novamente em alguns instantes.
                    code: SERVICE_UNAVAILABLE
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/lessons/{lesson}/video:
    get:
      tags: [Video]
      operationId: obterVideoDaAula
      summary: Estado da tentativa de video atual
      description: |
        E a rota que a interface consulta em intervalos enquanto o video esta em
