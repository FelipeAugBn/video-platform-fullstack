      summary: Arvore do curso concedido, so com aulas publicadas
      description: |
        A mesma arvore ordenada da visao do produtor, **sem rascunhos e sem
        estado de video**: a aula do consumidor tem cinco campos, e `video_state`
        nao e um deles.

        Modulo cujas aulas estejam todas em rascunho aparece com `lessons: []` —
        o que o consumidor deixa de ver e o conteudo nao publicado, nao a
        organizacao do curso.

        Curso sem concessao e curso inexistente respondem o **mesmo** `404`, com
        o mesmo corpo.
      parameters:
        - $ref: "#/components/parameters/CursoId"
      responses:
