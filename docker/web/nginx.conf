# Servidor HTTP do ambiente local, a frente do PHP-FPM.
#
# O arquivo e montado no diretorio de configuracoes que a imagem oficial ja
# inclui dentro do bloco `http`. Por isso declara apenas o bloco `server`:
# diretivas globais continuam vindo da imagem, sem copia local para manter.
#
# O container ve somente o diretorio publico do Laravel, em modo leitura. Codigo
# de aplicacao, dependencias e storage nao sao montados aqui — quem interpreta
# PHP e o servico `api`, e o unico arquivo que chega ate ele e o front
# controller.

server {
    listen 80;

    root /app/public;

    # Diretorio resolve para o front controller, nunca para uma listagem. O
    # modulo de listagem automatica vem desligado por padrao e nao e ligado.
    index index.php;

    # Padrao front controller: arquivo publico existente e servido como esta, e
    # todo o resto vira uma rota da aplicacao, com a query string preservada.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Arquivos e diretorios ocultos nao sao servidos. O caso concreto e o
    # `.htaccess` que acompanha o diretorio publico do Laravel: ele existe, e
    # inutil aqui e nao deve ser recuperavel por requisicao.
    #
    # Vem antes das demais expressoes regulares porque o servidor usa a primeira
    # que casar; assim um arquivo oculto terminado em `.php` tambem cai aqui.
    #
    # 404 em vez de 403: negar acesso confirmaria que o caminho existe.
    location ~ /\. {
        return 404;
    }

    # Unico caminho ate o PHP-FPM, por correspondencia exata.
    #
    # `SCRIPT_FILENAME` e um literal. Derivado da URL, uma requisicao com caminho
    # manipulado poderia apontar o interpretador para outro arquivo; literal, o
    # unico script executavel do ambiente e o front controller.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass api:9000;
    }

    # Qualquer outro `.php` deixa de existir aqui.
    #
    # A correspondencia exata acima tem precedencia sobre esta expressao regular,
    # entao o front controller segue acessivel e todo o resto para antes de
    # qualquer decisao sobre servir ou interpretar. Sem esta regra, um arquivo
    # `.php` que viesse a aparecer no diretorio publico casaria com `try_files` e
    # seria devolvido como texto, expondo codigo-fonte.
    location ~ \.php$ {
        return 404;
    }
}
