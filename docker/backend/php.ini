; Configuracao do PHP para os servicos que compartilham esta imagem.
;
; Instalado como `99-app.ini` no diretorio de configuracoes adicionais. Os
; arquivos de la sao lidos em ordem alfabetica e os da imagem oficial se chamam
; `docker-php-ext-*.ini`, entao este e lido antes deles — o que nao disputa
; nada, porque aqueles apenas carregam extensoes, sem definir diretiva. O que
; estiver aqui prevalece sobre os defaults da distribuicao.
;
; Somente ajustes gerais do ambiente. Configuracao da aplicacao pertence ao
; Laravel, e configuracao do pool de processos pertence ao PHP-FPM.

; ---------------------------------------------------------------------------
; Ambiente
; ---------------------------------------------------------------------------

; Toda data e gravada e comparada em UTC. A conversao para o fuso de quem le
; acontece na apresentacao. Fuso local no servidor produz registro ambiguo
; quando o horario de verao muda ou quando a maquina muda de regiao.
date.timezone = UTC

; Limite explicito e moderado. Nenhum caminho da aplicacao carrega arquivo
; grande em memoria: o video vai direto do navegador para o storage e o PHP so
; assina URLs e grava metadados. Um limite generoso aqui nao aceleraria nada e
; transformaria um vazamento de memoria em consumo silencioso do host.
memory_limit = 256M

; ---------------------------------------------------------------------------
; Erros
; ---------------------------------------------------------------------------

; Log ligado, saida na stderr do processo — em container e dali que a
; orquestracao coleta. Arquivo dentro do container se perderia junto com ele.
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Erro nunca vai no corpo da resposta, nem em desenvolvimento: a resposta da API
; e um contrato, e mensagem de erro do PHP no meio do JSON quebra o cliente
; alem de revelar caminho de arquivo e trecho de codigo. Quem precisa do detalhe
; le o log.
display_errors = Off
display_startup_errors = Off

; ---------------------------------------------------------------------------
; Exposicao
; ---------------------------------------------------------------------------

; Sem o cabecalho `X-Powered-By`. Nao e protecao, e reducao de informacao
; gratuita: a versao exata do interpretador nao ajuda nenhum cliente legitimo.
expose_php = Off

; ---------------------------------------------------------------------------
; Upload
; ---------------------------------------------------------------------------

; Deliberadamente pequeno. O video nao atravessa o PHP: o navegador envia as
; partes direto ao storage com URL pre-assinada, e a aplicacao so recebe JSON.
; Aumentar estes limites para acomodar video seria assumir um fluxo que a
; arquitetura nao tem.
upload_max_filesize = 8M
post_max_size = 8M

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------

opcache.enable = 1

; Desligado na CLI: os comandos Artisan e os workers sao processos curtos ou de
; codigo estavel, e o custo de compilar o cache a cada invocacao nao se paga.
opcache.enable_cli = 0

; Revalidacao por timestamp a cada requisicao. E o que faz uma edicao no host
; aparecer na proxima chamada, sem reconstruir a imagem nem reiniciar o
; processo — o codigo chega por bind mount.
;
; Este par e a escolha para desenvolvimento. Em producao a troca seria
; `validate_timestamps = 0`, com invalidacao no deploy: ali o arquivo nao muda
; sob o processo, e verificar o disco a cada requisicao so custa syscall.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
