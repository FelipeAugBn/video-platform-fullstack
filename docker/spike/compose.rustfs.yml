# Compose isolado do spike de validacao do storage.
#
# Nao e o ambiente da aplicacao: sobe apenas o storage e um cliente S3, numa
# rede propria e com nome de projeto proprio, para nao colidir com nada. E
# andaime descartavel.
#
# As credenciais abaixo sao ficticias e valem somente dentro deste compose
# isolado. Nao sao segredo e nao existem fora daqui.

name: spike-rustfs

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    environment:
      RUSTFS_ACCESS_KEY: spike-access-local
      RUSTFS_SECRET_KEY: spike-secret-local
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      # Endpoint publico: porta 19000 no host, deliberadamente diferente da
      # porta interna 9000, para que confundir os dois enderecos seja um erro
      # visivel e nao um acerto por coincidencia.
      - "19000:9000"
    volumes:
      - dados:/data
    networks:
      - spike
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  cliente-interno:
    image: python:3.13.15-slim-trixie@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    # Fica atras de um profile para que `docker compose up -d` suba somente o
    # storage. `docker compose run` habilita o profile sozinho, e o
    # `executar.sh` passa `--profile cliente` ao gerar a configuracao para que
    # esta imagem tambem entre na verificacao de versao fixada.
    profiles: ["cliente"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      # Os dois enderecos do storage, separados de proposito (plan 16.3).
      # O interno e usado nas chamadas; o publico so para assinar as URLs que
      # o cliente externo vai consumir.
      SPIKE_ENDPOINT_INTERNO: http://rustfs:9000
      SPIKE_ENDPOINT_PUBLICO: http://localhost:19000
      SPIKE_ACCESS_KEY: spike-access-local
      SPIKE_SECRET_KEY: spike-secret-local
      SPIKE_REGION: us-east-1
      SPIKE_BUCKET: spike-videos
      SPIKE_OBJETO: videos/spike-parte-unica.mp4
      SPIKE_CONTENT_TYPE: video/mp4
      SPIKE_ORIGEM_FRONTEND: http://localhost:3000
      SPIKE_TAMANHO_AMOSTRA: "8388608"
      SPIKE_VALIDADE_PUT: "900"
      SPIKE_VALIDADE_GET: "300"
      SPIKE_BOTO3_VERSAO: "1.40.24"
      PYTHONPATH: /pylibs
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/spike:ro
      - pylibs:/pylibs
    networks:
      - spike

networks:
  spike:
    name: spike-rustfs

volumes:
  dados:
  pylibs:
